name: seatrack
description: SeaTrack - Automated SeaBank Expense Tracker

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  notification_listener_service: any
  provider: ^6.1.2
  flutter_dotenv: ^6.0.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  flutter_local_notifications: ^22.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
